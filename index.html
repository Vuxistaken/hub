<script>
window.onerror = function (msg, src, line, col) {
  var b = document.getElementById('errbox');
  if (!b) {
    b = document.createElement('div');
    b.id = 'errbox';
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;background:#b00020;color:#fff;font:20px/1.3 Helvetica,Arial,sans-serif;padding:14px 20px;-webkit-user-select:text';
    (document.body || document.documentElement).appendChild(b);
  }
  b.innerHTML += 'HATA: ' + msg + ' (satır ' + line + ')<br>';
  return false;
};
</script>
<style>
:root{
  --bg:#10151C; --card:#1A222C; --text:#F2F4F7; --muted:#A3AFBF; --accent:#F5B54A; --track:#2C3744;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#10151C;background:var(--bg);
  color:#F2F4F7;color:var(--text);
  font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
#app{position:fixed;top:0;left:0;right:0;bottom:0;padding:32px 44px 36px 44px;
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.head{height:44px;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;
  -webkit-align-items:center;align-items:center;margin-bottom:14px}
#greet{font-size:22px;letter-spacing:.02em;color:#A3AFBF;color:var(--muted)}
#hint{font-size:16px;color:#A3AFBF;color:var(--muted);border:1px solid #A3AFBF;border-color:var(--muted);
  border-radius:20px;padding:8px 16px}
.headr{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
#week{font-size:20px;letter-spacing:.04em;color:#F5B54A;color:var(--accent);margin-right:18px}
#modeBtn{font-family:inherit;font-size:17px;min-height:44px;padding:0 20px;border-radius:22px;background:transparent;
  border:1px solid #A3AFBF;border-color:var(--muted);color:#A3AFBF;color:var(--muted);outline:none}
.card{background:#1A222C;background:var(--card);border-radius:28px}
.row{display:-webkit-flex;display:flex}
.main{-webkit-flex:1;flex:1;min-height:0;margin-bottom:22px}
.clock{-webkit-flex:1.3;flex:1.3;min-width:0;padding:26px 32px;margin-right:22px;display:-webkit-flex;display:flex;
  -webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between}
#time{font-size:22vh;line-height:1;font-weight:300;letter-spacing:-.03em;white-space:nowrap}
#dayname{font-size:40px;font-weight:500;line-height:1.1}
#datefull{font-size:24px;color:#A3AFBF;color:var(--muted);margin-top:4px}
.wx{-webkit-flex:1;flex:1;min-width:0;padding:26px 30px;display:-webkit-flex;display:flex;
  -webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between}
.loc{font-size:20px;color:#A3AFBF;color:var(--muted);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.loc svg{margin-right:8px}
#wxStatus{font-size:15px;margin-left:auto;color:#A3AFBF;color:var(--muted)}
.wxmid{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between}
#temp{font-size:15vh;line-height:1;font-weight:300;letter-spacing:-.03em}
#wxIcon{color:#F5B54A;color:var(--accent)}
#wxDesc{font-size:28px;font-weight:500}
#wxSub{font-size:19px;color:#A3AFBF;color:var(--muted);margin-top:6px}
.metrics{height:118px;margin-bottom:22px}
.metric{-webkit-flex:1;flex:1;min-width:0;margin-right:22px;padding:16px 22px;border-radius:24px;
  background:#1A222C;background:var(--card);display:-webkit-flex;display:flex;-webkit-flex-direction:column;
  flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between}
.metric:last-child{margin-right:0}
.mlabel{font-size:18px;color:#A3AFBF;color:var(--muted);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.mlabel svg{margin-right:8px}
.mval{font-size:38px;font-weight:500;line-height:1}
.mval small{font-size:20px;font-weight:400;color:#A3AFBF;color:var(--muted)}
.msub{font-size:17px;color:#A3AFBF;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:#2C3744;background:var(--track);overflow:hidden}
.bar div{height:6px;background:#F5B54A;background:var(--accent);width:0}
.bottom{height:138px}
.fc{-webkit-flex:3;flex:3;min-width:0;margin-right:22px}
.day{-webkit-flex:1;flex:1;min-width:0;margin-right:12px;padding:12px 6px;border-radius:22px;
  background:#1A222C;background:var(--card);display:-webkit-flex;display:flex;-webkit-flex-direction:column;
  flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between}
.day:last-child{margin-right:0}
.dname{font-size:18px;color:#A3AFBF;color:var(--muted)}
.dtemp{font-size:20px;font-weight:500}
.dtemp span{font-weight:400;color:#A3AFBF;color:var(--muted)}
.quote{-webkit-flex:2;flex:2;min-width:0;padding:16px 24px;border-radius:24px;background:#1A222C;background:var(--card);
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between}
.qlabel{font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:#F5B54A;color:var(--accent)}
#quoteText{font-size:23px;line-height:1.25;font-weight:500}
#nosleep{position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none}

.sep{display:none}
@media (orientation:portrait){
  #app{padding:24px 28px 28px 28px}
  .head{margin-bottom:10px}
  .main{-webkit-flex-direction:column;flex-direction:column;margin-bottom:16px}
  .clock{-webkit-flex:1;flex:1;margin-right:0;margin-bottom:16px;padding:18px 28px}
  .wx{padding:18px 28px}
  #time{font-size:18vw}
  #temp{font-size:13vw}
  .clock > div:last-child{display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline}
  #dayname{font-size:34px;margin-right:16px}
  #datefull{margin-top:0}
  #wxDesc{font-size:26px}
  #wxSub{font-size:18px;margin-top:2px;white-space:nowrap}
  #wxSub br{display:none}
  .sep{display:inline}
  #wxIcon svg{width:88px;height:88px}
  .metrics{height:auto;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-bottom:16px}
  .metric{-webkit-flex:1 1 40%;flex:1 1 40%;height:96px;margin-right:16px;margin-bottom:14px;padding:12px 20px}
  .metric:nth-child(2n){margin-right:0}
  .metric:nth-child(n+3){margin-bottom:0}
  .mval{font-size:32px}
  .bottom{height:auto;-webkit-flex-direction:column;flex-direction:column}
  .fc{margin-right:0;margin-bottom:16px;height:112px}
  .day{padding:8px 6px}
  .quote{height:84px;padding:12px 24px;-webkit-justify-content:center;justify-content:center}
  #quoteText{margin-top:4px}
}
</style>
</head>

    <div class="metric">
      <div class="mlabel"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18h18"></path><path d="M7 18a5 5 0 0110 0"></path><path d="M12 6v3"></path><path d="M5.6 10.6L7 12"></path><path d="M18.4 10.6L17 12"></path></svg>Gün ışığı</div>
      <div class="mval" id="sunrise">--</div>
      <div class="msub" id="sunset">&nbsp;</div>
    </div>
  </div>

  <div class="row bottom">
    <div class="row fc" id="forecast"></div>
    <div class="quote">
      <div class="qlabel">Günün sözü</div>
      <div id="quoteText"></div>
    </div>
  </div>

</div>

  function describe(code) {
    if (code === 0) { return { k: 'clear', t: 'Açık' }; }
    if (code === 1) { return { k: 'clear', t: 'Çoğunlukla açık' }; }
    if (code === 2) { return { k: 'partly', t: 'Parçalı bulutlu' }; }
    if (code === 3) { return { k: 'cloud', t: 'Kapalı' }; }
    if (code === 45 || code === 48) { return { k: 'fog', t: 'Sisli' }; }
    if (code >= 51 && code <= 57) { return { k: 'rain', t: 'Çisenti' }; }
    if (code === 61) { return { k: 'rain', t: 'Hafif yağmur' }; }
    if (code === 63) { return { k: 'rain', t: 'Yağmurlu' }; }
    if (code === 65 || code === 66 || code === 67) { return { k: 'rain', t: 'Kuvvetli yağmur' }; }
    if (code === 71 || code === 73 || code === 75 || code === 77) { return { k: 'snow', t: 'Karlı' }; }
    if (code >= 80 && code <= 82) { return { k: 'rain', t: 'Sağanak yağış' }; }
    if (code === 85 || code === 86) { return { k: 'snow', t: 'Kar sağanağı' }; }
    if (code === 95) { return { k: 'storm', t: 'Gök gürültülü fırtına' }; }
    if (code === 96 || code === 99) { return { k: 'storm', t: 'Dolu ve fırtına' }; }
    return { k: 'cloud', t: 'Bulutlu' };
  }

  // ---- Saat, tarih, gün sözü ----
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 86400000 + 1) / 7);
  }
  function greeting(h) {
    if (h >= 5 && h < 12) { return 'Günaydın'; }
    if (h >= 12 && h < 18) { return 'İyi günler'; }
    if (h >= 18 && h < 23) { return 'İyi akşamlar'; }
    return 'İyi geceler';
  }

  var lastMinute = -1, lastDay = -1;
  function tick() {
    var now = new Date();
    var m = now.getMinutes();
    $('time').textContent = pad(now.getHours()) + ':' + pad(m);
    if (m !== lastMinute) {
      lastMinute = m;
      $('greet').textContent = greeting(now.getHours());
      applyTheme(now);
    }
    if (now.getDate() !== lastDay) {
      lastDay = now.getDate();
      $('dayname').textContent = DAYS[now.getDay()];
      $('datefull').textContent = now.getDate() + ' ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
      $('week').textContent = 'Hafta ' + isoWeek(now);
      var start = new Date(now.getFullYear(), 0, 0);
      var doy = Math.floor((now - start) / 86400000);
      var q = QUOTES[doy % QUOTES.length];
      var qe = $('quoteText');
      qe.textContent = q;
      qe.style.fontSize = q.length > 36 ? '20px' : '23px';
    }
  }

  // ---- Hava durumu (Open-Meteo, anahtarsız) ----
  var URL_WX = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&forecast_days=6';

  var lastOk = null;
  function setStatus(text) { $('wxStatus').textContent = text; }
  function num(v) { return (typeof v === 'number' && isFinite(v)); }

  function render(d) {
    var c = d.current, dl = d.daily, i, html = '';
    if (!c || !dl) { return false; }
    var w = describe(c.weather_code);
    var kind = (w.k === 'clear' && c.is_day === 0) ? 'moon' : w.k;
    if (num(c.temperature_2m)) { $('temp').textContent = Math.round(c.temperature_2m) + '°'; }
    $('wxIcon').innerHTML = icon(kind, 104);
    $('wxDesc').textContent = w.t;
    var sub = [], hl = [];
    if (num(c.apparent_temperature)) { sub.push('Hissedilen ' + Math.round(c.apparent_temperature) + '°'); }
    if (dl.temperature_2m_max && num(dl.temperature_2m_max[0])) { hl.push('Yüksek ' + Math.round(dl.temperature_2m_max[0]) + '°'); }
    if (dl.temperature_2m_min && num(dl.temperature_2m_min[0])) { hl.push('Düşük ' + Math.round(dl.temperature_2m_min[0]) + '°'); }
    $('wxSub').innerHTML = sub.join('') + (sub.length && hl.length ? '<span class="sep"> · </span><br>' : '') + hl.join(' · ');

    if (num(c.relative_humidity_2m)) {
      $('hum').textContent = '%' + Math.round(c.relative_humidity_2m);
      $('humBar').style.width = Math.max(0, Math.min(100, c.relative_humidity_2m)) + '%';
    }
    if (num(c.wind_speed_10m)) {
      $('wind').innerHTML = Math.round(c.wind_speed_10m) + ' <small>km/sa</small>';
    }
    if (num(c.wind_direction_10m)) {
      $('windDir').textContent = COMPASS[Math.round(c.wind_direction_10m / 45) % 8];
    }
    if (num(c.pressure_msl)) {
      $('press').innerHTML = Math.round(c.pressure_msl) + ' <small>hPa</small>';
    }
    if (dl.sunrise && dl.sunrise[0]) { $('sunrise').textContent = String(dl.sunrise[0]).substr(11, 5); }
    if (dl.sunset && dl.sunset[0]) { $('sunset').textContent = 'Batış ' + String(dl.sunset[0]).substr(11, 5); }

    for (i = 1; i <= 5; i++) {
      if (!dl.time || !dl.time[i]) { break; }
      var p = String(dl.time[i]).split('-');
      var dow = new Date(+p[0], +p[1] - 1, +p[2]).getDay();
      var dw = describe(dl.weather_code[i]);
      html += '<div class="day"><div class="dname">' + DAYS_SHORT[dow] + '</div>' + icon(dw.k, 40) +
        '<div class="dtemp">' + Math.round(dl.temperature_2m_max[i]) + '° <span>' + Math.round(dl.temperature_2m_min[i]) + '°</span></div></div>';
    }
    $('forecast').innerHTML = html;
    return true;
  }

  function stamp(date) { return pad(date.getHours()) + ':' + pad(date.getMinutes()); }

  function loadWeather() {
    var x = new XMLHttpRequest();
    x.open('GET', URL_WX, true);
    x.timeout = 20000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      var ok = false;
      if (x.status === 200) {
        try {
          var d = JSON.parse(x.responseText);
          if (render(d)) {
            ok = true;
            lastOk = new Date();
            store('hubWx', x.responseText);
            store('hubWxTime', String(lastOk.getTime()));
            setStatus('Güncellendi ' + stamp(lastOk));
          }
        } catch (e) { ok = false; }
      }
      if (!ok) {
        setStatus(lastOk ? 'Bağlantı yok · ' + stamp(lastOk) : 'Bağlantı yok');
        setTimeout(loadWeather, 60000);
      }
    };
    x.send();
  }

  // ---- Ekranı açık tutma (en iyi çaba) ----
  var video = $('nosleep');
  var awake = false;
  function wake() {
    try { video.muted = true; var pr = video.play(); if (pr && pr.catch) { pr.catch(function () {}); } } catch (e) {}
    try { if (navigator.wakeLock && navigator.wakeLock.request) { navigator.wakeLock.request('screen').catch(function () {}); } } catch (e2) {}
    if (!awake) {
      awake = true;
      $('hint').style.display = 'none';
    }
  }
  document.addEventListener('touchend', wake, false);
  document.addEventListener('click', wake, false);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && awake) { wake(); } }, false);
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, false);

  // ---- Başlat ----
  $('city').textContent = CITY;
  $('modeBtn').addEventListener('click', function () {
    mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
    store('hubMode', mode);
    applyTheme(new Date());
  }, false);

  tick();
  setInterval(tick, 1000);

  var cached = load('hubWx'), cachedTime = load('hubWxTime');
  if (cached) {
    try {
      if (render(JSON.parse(cached))) {
        lastOk = cachedTime ? new Date(+cachedTime) : null;
        setStatus(lastOk ? 'Eski veri · ' + stamp(lastOk) : 'Eski veri');
      }
    } catch (e3) {}
  }
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
  window.addEventListener('online', loadWeather, false);
})();
</script>
</body>
</html>
